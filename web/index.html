<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="color-scheme" content="light">
<title>Eng</title>
<!-- Painted before anything loads, so the window is never black or blank. -->
<style>
html, body { margin: 0; height: 100%; background: #B2B7BD; }
.boot { height: 100%; display: flex; align-items: center; justify-content: center; }
.boot i { width: 36px; height: 36px; border-radius: 50%; border: 4px solid #CBCFD4; border-top-color: #2F9BDD; animation: boot 0.8s linear infinite; }
@keyframes boot { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .boot i { animation-duration: 2.4s; } }
</style>
<link rel="stylesheet" href="styles.css">
<link rel="preload" href="fonts/cairo-arabic.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/lexend-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="i18n/languages.json" as="fetch" crossorigin>
<!-- Every module is fetched in parallel instead of one import level at a time. -->
<link rel="modulepreload" href="ads.js">
<link rel="modulepreload" href="api.js">
<link rel="modulepreload" href="app.js">
<link rel="modulepreload" href="challenge.js">
<link rel="modulepreload" href="dom.js">
<link rel="modulepreload" href="exercise.js">
<link rel="modulepreload" href="i18n.js">
<link rel="modulepreload" href="icons.js">
<link rel="modulepreload" href="league.js">
<link rel="modulepreload" href="limit.js">
<link rel="modulepreload" href="map.js">
<link rel="modulepreload" href="nav.js">
<link rel="modulepreload" href="pro.js">
<link rel="modulepreload" href="profile.js">
<link rel="modulepreload" href="result.js">
<link rel="modulepreload" href="settings.js">
<link rel="modulepreload" href="words.js">
<!-- defer keeps it ahead of app.js without blocking the first paint. -->
<script src="https://telegram.org/js/telegram-web-app.js" defer></script>
</head>
<body>
<div id="app"><div class="boot"><i></i></div></div>
<script type="module" src="app.js"></script>
</body>
</html>
